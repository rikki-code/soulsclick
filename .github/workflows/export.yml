name: Export

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      preset:
        description: Preset to export ("default" = CI set, "all" = every preset)
        type: choice
        default: default
        options:
          - default
          - all
          - macos-universal
          - linux-x86_64
          - linux-arm64
          - windows-x86_64
          - windows-arm64
          - web

env:
  GODOT_VERSION: "4.7"
  GODOT_RELEASE: "stable"
  DEFAULT_PRESETS: '["macos-universal", "linux-x86_64", "windows-x86_64", "web"]'

jobs:
  presets:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.select.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - id: select
        env:
          INPUT: ${{ inputs.preset || 'default' }}
        run: |
          case "$INPUT" in
            default) list="$DEFAULT_PRESETS" ;;
            all) list="$(python3 -B -c 'import json, sys; sys.path.insert(0, "ci"); import export; print(json.dumps(list(export.load_presets())))')" ;;
            *) list="[\"$INPUT\"]" ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "presets: $list"

  # Builds the Godot image once and pushes it to GHCR; skipped if the tag exists.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - id: ref
        run: |
          hash="${{ hashFiles('ci/Dockerfile') }}"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/soulsclicker-godot:${GODOT_VERSION}-${GODOT_RELEASE}-${hash::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: check
        run: |
          if docker manifest inspect "${{ steps.ref.outputs.ref }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push Godot image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ci
          push: true
          tags: ${{ steps.ref.outputs.ref }}
          build-args: |
            GODOT_VERSION=${{ env.GODOT_VERSION }}
            GODOT_RELEASE=${{ env.GODOT_RELEASE }}

  export:
    name: Export ${{ matrix.preset }}
    needs: [presets, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.list) }}
    steps:
      - uses: actions/checkout@v7

      - name: Export
        run: python3 ci/export.py ${{ matrix.preset }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: soulsclicker-${{ matrix.preset }}
          path: build/${{ matrix.preset }}
          if-no-files-found: error

      - name: Upload Pages artifact
        if: matrix.preset == 'web' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  pages:
    if: github.ref == 'refs/heads/main' && contains(fromJSON(needs.presets.outputs.list), 'web')
    needs: [presets, export]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: soulsclicker-*
      - name: Package artifacts
        working-directory: dist
        run: for d in */; do (cd "$d" && zip -qr "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
